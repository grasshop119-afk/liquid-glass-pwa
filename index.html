<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Liquid Glass">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <title>Liquid Glass Showcase</title>

  <style>
    :root {
      --bg: #000000;
      --tab-bar-bg: rgba(22, 22, 26, 0.65);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* Фоновые яркие элементы (как на референсе Apple), чтобы было видно преломление стекла */
    .ambient-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(55px);
      opacity: 0.7;
      animation: pulseFloat 10s infinite alternate ease-in-out;
    }

    .orb-orange {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, #FF9500, #FF2D55);
      bottom: -40px;
      left: 10%;
    }

    .orb-blue {
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, #0A84FF, #5E5CE6);
      bottom: -20px;
      right: 12%;
      animation-delay: -4s;
    }

    .orb-cyan {
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, #64D2FF, #30D158);
      bottom: 70px;
      left: 42%;
      opacity: 0.5;
      animation-delay: -7s;
    }

    @keyframes pulseFloat {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-30px) scale(1.12); }
    }

    .title-badge {
      position: relative;
      z-index: 1;
      margin-top: calc(env(safe-area-inset-top, 20px) + 24px);
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .tab-bar-container {
      position: relative;
      z-index: 10;
      width: 92%;
      max-width: 420px;
      margin-bottom: calc(18px + env(safe-area-inset-bottom, 15px));
    }

    /* 
      1. БАЗОВЫЙ ТАББАР — МАТОВОЕ ТОЛСТОЕ СТЕКЛО 
      (Двойная оптическая кромка + глубокое преломление)
    */
    .ios-glass-bar {
      position: relative;
      width: 100%;
      height: 72px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 6px;

      background: var(--tab-bar-bg);
      backdrop-filter: blur(35px) saturate(210%);
      -webkit-backdrop-filter: blur(35px) saturate(210%);

      /* Объемный стеклянный обод: сверху падает яркий свет, снизу тень */
      box-shadow: 
        inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.35),
        inset 0 -1.5px 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 0 20px 0 rgba(255, 255, 255, 0.03),
        0 24px 48px rgba(0, 0, 0, 0.75),
        0 4px 12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    /* 
      2. БЕГУНОК-КАПЛЯ — ТО САМОЕ ЖИДКОЕ СТЕКЛО (LIQUID GLASS DROP)
      Выпуклая линза с яркой каустикой и 3D-бликом
    */
    .liquid-droplet {
      position: absolute;
      top: 6px;
      left: 6px;
      height: calc(100% - 12px);
      border-radius: 32px;
      pointer-events: none;
      z-index: 2;
      box-sizing: border-box;

      /* Линзовое осветление и четкое размытие */
      backdrop-filter: blur(14px) brightness(1.25) saturate(180%);
      -webkit-backdrop-filter: blur(14px) brightness(1.25) saturate(180%);

      /* Градиент преломления света в толще линзы */
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.40) 0%,
        rgba(255, 255, 255, 0.12) 45%,
        rgba(255, 255, 255, 0.05) 75%,
        rgba(255, 255, 255, 0.25) 100%
      );

      /* Оптические фаски: сияющий верхний край и темная линзовая глубина */
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 
        inset 0 2px 2px rgba(255, 255, 255, 0.85),
        inset 0 -2px 3px rgba(0, 0, 0, 0.35),
        inset 0 0 10px rgba(255, 255, 255, 0.3),
        0 10px 22px rgba(0, 0, 0, 0.5),
        0 2px 6px rgba(10, 132, 255, 0.3);

      will-change: left, width, transform;
      transform-origin: center center;
      transition: border-color 0.18s ease;
    }

    /* Верхний дуговой блик стекла (Gloss Highlight) */
    .liquid-droplet::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 10%;
      width: 80%;
      height: 42%;
      border-radius: 20px 20px 30px 30px;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.7) 0%,
        rgba(255, 255, 255, 0.1) 70%,
        transparent 100%
      );
      pointer-events: none;
    }

    /* Элементы таббара */
    .tab-item {
      position: relative;
      z-index: 3;
      flex: 1;
      height: 100%;
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      outline: none;
      padding: 0;
    }

    .icon-box {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.45);
      transition: color 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .icon-box svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .tab-label {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: -0.1px;
      transition: color 0.25s ease;
    }

    /* Активное состояние кнопки */
    .tab-item.active .icon-box {
      color: #FFFFFF;
      transform: translateY(-2px) scale(1.1);
      filter: drop-shadow(0 2px 6px rgba(255, 255, 255, 0.4));
    }

    .tab-item.active .tab-label {
      color: #FFFFFF;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Фоновые градиентные сферы -->
  <div class="ambient-canvas">
    <div class="glow-orb orb-orange"></div>
    <div class="glow-orb orb-blue"></div>
    <div class="glow-orb orb-cyan"></div>
  </div>

  <div class="title-badge">Liquid Glass Showcase</div>

  <div class="tab-bar-container">
    <nav class="ios-glass-bar" id="tabBar">
      <!-- Капля-линза -->
      <div class="liquid-droplet" id="droplet"></div>

      <button class="tab-item active" data-index="0">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </div>
        <span class="tab-label">Главная</span>
      </button>

      <button class="tab-item" data-index="1">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
        </div>
        <span class="tab-label">Медиа</span>
      </button>

      <button class="tab-item" data-index="2">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
        <span class="tab-label">Любимое</span>
      </button>

      <button class="tab-item" data-index="3">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </div>
        <span class="tab-label">Опции</span>
      </button>
    </nav>
  </div>

  <script>
    const droplet = document.getElementById('droplet');
    const tabs = document.querySelectorAll('.tab-item');

    // Физика пружины для гидродинамического перетекания капли
    const SPRING = { tension: 320, friction: 27, mass: 1 };

    let state = {
      leadX: 0, targetLeadX: 0, vLead: 0,
      trailX: 0, targetTrailX: 0, vTrail: 0,
      scaleY: 1, targetScaleY: 1, vScaleY: 0,
      isMoving: false,
      currentIndex: 0
    };

    function springStep(cur, target, vel, k, d, m) {
      const force = -k * (cur - target);
      const damping = -d * vel;
      const acc = (force + damping) / m;
      vel += acc * 0.016;
      cur += vel * 0.016;
      return [cur, vel];
    }

    function animate() {
      // 1. Передний и задний края капли движутся независимо (эффект текучей жидкости)
      [state.leadX, state.vLead] = springStep(
        state.leadX, state.targetLeadX, state.vLead, 
        SPRING.tension * 1.1, SPRING.friction * 0.95, SPRING.mass
      );
      
      [state.trailX, state.vTrail] = springStep(
        state.trailX, state.targetTrailX, state.vTrail, 
        SPRING.tension * 0.85, SPRING.friction * 1.05, SPRING.mass
      );

      const minX = Math.min(state.leadX, state.trailX);
      const maxX = Math.max(state.leadX, state.trailX);
      const width = maxX - minX;

      // 2. В полете капля слегка утончается по высоте (эффект поверхностного натяжения)
      const stretch = Math.abs(state.leadX - state.trailX);
      state.targetScaleY = stretch > 20 ? 0.90 : 1.0;

      [state.scaleY, state.vScaleY] = springStep(
        state.scaleY, state.targetScaleY, state.vScaleY, 
        280, 22, 1
      );

      droplet.style.left = `${minX}px`;
      droplet.style.width = `${width}px`;
      droplet.style.transform = `scaleY(${state.scaleY})`;

      const speed = Math.abs(state.vLead) + Math.abs(state.vTrail);
      if (speed > 0.1 || stretch > 1) {
        requestAnimationFrame(animate);
      } else {
        state.isMoving = false;
      }
    }

    function setActiveTab(tab, instant = false) {
      const idx = parseInt(tab.dataset.index);
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      const targetX = tab.offsetLeft;
      const targetW = tab.offsetWidth;

      if (instant) {
        state.leadX = targetX + targetW;
        state.trailX = targetX;
        state.targetLeadX = state.leadX;
        state.targetTrailX = state.trailX;
        droplet.style.left = `${targetX}px`;
        droplet.style.width = `${targetW}px`;
        return;
      }

      if (targetX > state.trailX) {
        state.targetLeadX = targetX + targetW;
        state.targetTrailX = targetX;
      } else {
        state.targetTrailX = targetX;
        state.targetLeadX = targetX + targetW;
      }

      state.currentIndex = idx;

      // Безопасная вибрация (если доступна)
      try {
        if (window.navigator?.vibrate) navigator.vibrate(8);
      } catch (e) {}

      if (!state.isMoving) {
        state.isMoving = true;
        requestAnimationFrame(animate);
      }
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => setActiveTab(tab));
    });

    // Инициализация
    window.addEventListener('load', () => {
      const active = document.querySelector('.tab-item.active');
      if (active) setActiveTab(active, true);
    });

    // Безопасная регистрация Service Worker только по HTTP/HTTPS (не в file://)
    if (location.protocol.startsWith('http') && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
