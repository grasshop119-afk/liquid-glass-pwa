<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Метатеги для чистого нативного вида в iOS Safari и Android Chrome -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Liquid Glass">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <title>Liquid Glass Showcase</title>

  <!-- Telegram WebApp SDK для тактильной отдачи Taptic Engine -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #000000;
      --accent: #0A84FF;
      --text-dim: rgba(255, 255, 255, 0.45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* Фоновые живые градиенты — свет под ними преломляется сквозь жидкое стекло */
    .ambient-background {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 14s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #ff5e3a, #ff2a6d);
      bottom: -60px;
      left: -40px;
    }

    .blob-2 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, #007aff, #5ac8fa);
      bottom: -20px;
      right: -30px;
      animation-delay: -5s;
    }

    .blob-3 {
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, #ffd60a, #ff9f0a);
      bottom: 60px;
      left: 35%;
      opacity: 0.22;
      animation-delay: -8s;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-40px) scale(1.15); }
    }

    /* Индикатор контента */
    .header-hint {
      position: relative;
      z-index: 1;
      margin-top: calc(env(safe-area-inset-top) + 24px);
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Контейнер панели */
    .tab-bar-container {
      position: relative;
      z-index: 10;
      width: 92%;
      max-width: 410px;
      margin-bottom: calc(16px + env(safe-area-inset-bottom));
    }

    /* 
      1. КОРПУС ТАББАРА — ГЛУБОКОЕ МАТОВОЕ СТЕКЛО (FROSTED LIQUID BASE)
      Использует тройной каустический ободок + рассеивание
    */
    .liquid-tab-bar {
      position: relative;
      width: 100%;
      height: 70px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 5px;

      /* Физическое стекло: преломление + ультра-глубокое размытие */
      background: rgba(20, 20, 24, 0.55);
      backdrop-filter: blur(40px) saturate(210%);
      -webkit-backdrop-filter: blur(40px) saturate(210%);

      /* Объемная стеклянная кромка (Bevel highlight): сверху свет падает ярче */
      box-shadow: 
        inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.38),
        inset 0 -1.5px 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 0 18px 0 rgba(255, 255, 255, 0.04),
        0 20px 45px rgba(0, 0, 0, 0.8),
        0 4px 12px rgba(0, 0, 0, 0.5);
      border: 0.5px solid rgba(255, 255, 255, 0.18);
    }

    /* 
      2. БЕГУНОК-КАПЛЯ — ЧИСТОЕ ОПТИЧЕСКОЕ ЖИДКОЕ СТЕКЛО (LIQUID DROPLET)
      Здесь достигается эффект выпуклой линзы со сдвигом света
    */
    .liquid-droplet {
      position: absolute;
      top: 5px;
      left: 5px;
      height: calc(100% - 10px);
      border-radius: 35px;
      pointer-events: none;
      z-index: 2;
      box-sizing: border-box;
      transform-origin: center center;

      /* Оптический эффект линзы через встроенный шейдер преломления */
      backdrop-filter: url(#liquid-refraction) blur(8px) saturate(220%) brightness(1.2);
      -webkit-backdrop-filter: blur(8px) saturate(220%) brightness(1.2);

      /* Желейный стеклянный градиент с каустикой */
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.42) 0%,
        rgba(255, 255, 255, 0.14) 40%,
        rgba(255, 255, 255, 0.04) 70%,
        rgba(255, 255, 255, 0.22) 100%
      );

      /* Линзовый кант, внутренний фокус света и стеклянный контур */
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: 
        inset 0 2px 4px rgba(255, 255, 255, 0.75),
        inset 0 -2px 5px rgba(0, 0, 0, 0.35),
        inset 0 0 12px rgba(255, 255, 255, 0.3),
        0 8px 24px -2px rgba(0, 0, 0, 0.55),
        0 2px 6px rgba(0, 122, 255, 0.25);

      will-change: transform, left, width;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    /* Верхний глянцевый блик на куполе капли (Specular Reflection) */
    .liquid-droplet::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 12%;
      width: 76%;
      height: 45%;
      border-radius: 20px 20px 30px 30px;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.65) 0%,
        rgba(255, 255, 255, 0.12) 65%,
        transparent 100%
      );
      pointer-events: none;
      filter: blur(0.5px);
    }

    /* В состоянии растягивания в полете капля становится более прозрачной и линзовой */
    .liquid-droplet.stretching {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.28) 0%,
        rgba(255, 255, 255, 0.06) 50%,
        rgba(255, 255, 255, 0.18) 100%
      );
      border-color: rgba(255, 255, 255, 0.75);
    }

    /* Элементы таббара */
    .tab-item {
      position: relative;
      z-index: 3;
      flex: 1;
      height: 100%;
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      outline: none;
    }

    .icon-box {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.25s ease;
    }

    .icon-box svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .tab-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: -0.1px;
      transition: color 0.25s ease, transform 0.3s ease;
    }

    /* Активное состояние */
    .tab-item.active .icon-box {
      color: #FFFFFF;
      transform: translateY(-2px) scale(1.08);
      filter: drop-shadow(0 2px 8px rgba(255, 255, 255, 0.45));
    }

    .tab-item.active .tab-title {
      color: #FFFFFF;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- SVG Шейдер оптической рефракции (преломляет свет как настоящее стекло) -->
  <svg style="position: fixed; top: -9999px; left: -9999px; width: 0; height: 0;" aria-hidden="true">
    <filter id="liquid-refraction" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Создание карты нормалей выпуклой линзы -->
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.015" numOctaves="1" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="ambient-background">
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    <div class="ambient-blob blob-3"></div>
  </div>

  <div class="header-hint">Liquid Glass Showcase</div>

  <div class="tab-bar-container">
    <nav class="liquid-tab-bar" id="tabBar">
      <!-- Та самая оптическая капля -->
      <div class="liquid-droplet" id="droplet"></div>

      <!-- Вкладка 1 -->
      <button class="tab-item active" data-index="0">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </div>
        <span class="tab-title">Главная</span>
      </button>

      <!-- Вкладка 2 -->
      <button class="tab-item" data-index="1">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
        </div>
        <span class="tab-title">Медиа</span>
      </button>

      <!-- Вкладка 3 -->
      <button class="tab-item" data-index="2">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
        <span class="tab-title">Избранное</span>
      </button>

      <!-- Вкладка 4 -->
      <button class="tab-item" data-index="3">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </div>
        <span class="tab-title">Опции</span>
      </button>
    </nav>
  </div>

  <script>
    /* 
      ДВУХРЕБЕРНАЯ ГИДРОДИНАМИКА КАПЛИ (VISCOUS LIQUID SPRING)
      Капля ведет себя как вязкая жидкость: передний край вытягивается вперед,
      хвост подтягивается с запозданием, создавая естественный желеобразный перетек.
    */
    const droplet = document.getElementById('droplet');
    const tabs = document.querySelectorAll('.tab-item');

    // Физика пружины
    const SPRING = { tension: 340, friction: 28, mass: 1 };

    let state = {
      leadX: 0, targetLeadX: 0, vLead: 0,
      trailX: 0, targetTrailX: 0, vTrail: 0,
      scaleY: 1, targetScaleY: 1, vScaleY: 0,
      isMoving: false,
      currentIndex: 0
    };

    function springStep(cur, target, vel, k, d, m) {
      const force = -k * (cur - target);
      const damping = -d * vel;
      const acc = (force + damping) / m;
      vel += acc * 0.016;
      cur += vel * 0.016;
      return [cur, vel];
    }

    function animate() {
      // 1. Пружиним передний и задний край раздельно (вязкое натяжение)
      [state.leadX, state.vLead] = springStep(
        state.leadX, state.targetLeadX, state.vLead, 
        SPRING.tension * 1.1, SPRING.friction * 0.95, SPRING.mass
      );
      
      [state.trailX, state.vTrail] = springStep(
        state.trailX, state.targetTrailX, state.vTrail, 
        SPRING.tension * 0.85, SPRING.friction * 1.05, SPRING.mass
      );

      // Вычисление текущего левого края и ширины растянутой капли
      const minX = Math.min(state.leadX, state.trailX);
      const maxX = Math.max(state.leadX, state.trailX);
      const width = maxX - minX;

      // 2. Деформация по вертикали: при растяжении в длину капля утончается
      const stretch = Math.abs(state.leadX - state.trailX);
      if (stretch > 18) {
        state.targetScaleY = 0.88; // сжимаем по высоте как реальную каплю
        droplet.classList.add('stretching');
      } else {
        state.targetScaleY = 1.0;
        droplet.classList.remove('stretching');
      }

      [state.scaleY, state.vScaleY] = springStep(
        state.scaleY, state.targetScaleY, state.vScaleY, 
        280, 20, 1
      );

      // Применение рассчитанных координат к капле
      droplet.style.left = `${minX}px`;
      droplet.style.width = `${width}px`;
      droplet.style.transform = `scaleY(${state.scaleY})`;

      const speed = Math.abs(state.vLead) + Math.abs(state.vTrail);
      if (speed > 0.1 || stretch > 1) {
        requestAnimationFrame(animate);
      } else {
        state.isMoving = false;
        droplet.classList.remove('stretching');
      }
    }

    function setActiveTab(tab, instant = false) {
      const idx = parseInt(tab.dataset.index);
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      const targetX = tab.offsetLeft;
      const targetW = tab.offsetWidth;

      if (instant) {
        state.leadX = targetX + targetW;
        state.trailX = targetX;
        state.targetLeadX = state.leadX;
        state.targetTrailX = state.trailX;
        droplet.style.left = `${targetX}px`;
        droplet.style.width = `${targetW}px`;
        return;
      }

      // Направление движения для правильного «выстреливания» капли
      if (targetX > state.trailX) {
        // Движение вправо: передний край летит первым
        state.targetLeadX = targetX + targetW;
        state.targetTrailX = targetX;
      } else {
        // Движение влево: задний край летит первым
        state.targetTrailX = targetX;
        state.targetLeadX = targetX + targetW;
      }

      state.currentIndex = idx;

      // Taptic Feedback (если запущено в Telegram или поддерживается вибрация)
      if (window.Telegram?.WebApp?.HapticFeedback) {
        Telegram.WebApp.HapticFeedback.selectionChanged();
      } else if (navigator.vibrate) {
        navigator.vibrate(8);
      }

      if (!state.isMoving) {
        state.isMoving = true;
        requestAnimationFrame(animate);
      }
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => setActiveTab(tab));
    });

    // Инициализация при старте
    window.addEventListener('DOMContentLoaded', () => {
      const active = document.querySelector('.tab-item.active');
      setActiveTab(active, true);
    });

    // Регистрация Service Worker для PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
  </script>
</body>
</html>
